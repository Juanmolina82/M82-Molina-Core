<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M82 - Molina Core v2.0</title>
    <style>
        :root {
            --bg-color: #030712;
            --panel-color: #0f172a;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --border-color: #1e293b;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        h1 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--accent-color);
            letter-spacing: 1px;
        }
        .console-area {
            flex: 1;
            background: #020617;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            overflow-y: auto;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }
        .log { margin: 5px 0; border-left: 3px solid #475569; padding-left: 8px; white-space: pre-line; }
        .log.success { border-color: #22c55e; }
        .log.error { border-color: #ef4444; }
        .log.sys { border-color: #3b82f6; }
        .input-group { display: flex; gap: 8px; }
        input {
            flex: 1;
            background: #090d16;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 6px;
        }
        button {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>M82-MOLINA: CENTRAL CORE v2.0</h1>
    </header>

    <div class="console-area" id="historial">
        <div class="log sys">[Sistema]: Conectado al Cerebro central en Python.</div>
        <div class="log sys">[Guía]: Comandos válidos:\n - "disparar [toneladas]"\n - "estelar [fracción]"</div>
    </div>

    <div class="input-group">
        <input type="text" id="inputComando" placeholder="Escribe aquí tu comando..." autocomplete="off">
        <button onclick="enviarAlCerebro()">ENVIAR</button>
    </div>

    <script>
        const historial = document.getElementById('historial');

        async function enviarAlCerebro() {
            const cmd = document.getElementById('inputComando').value.trim();
            if(!cmd) return;

            // Enviar petición POST a la API de Python
            try {
                const response = await fetch('/api/calcular', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comando: cmd })
                });
                const data = await response.json();

                const div = document.createElement('div');
                if(data.status === 'success') {
                    div.className = 'log success';
                    div.innerText = data.resultado;
                } else {
                    div.className = 'log error';
                    div.innerText = `[Error]: ${data.message}`;
                }
                historial.appendChild(div);
            } catch (err) {
                const div = document.createElement('div');
                div.className = 'log error';
                div.innerText = `[Error de Red]: No se pudo contactar con el Cerebro en Python.`;
                historial.appendChild(div);
            }

            historial.scrollTop = historial.scrollHeight;
            document.getElementById('inputComando').value = '';
        }
    </script>
</body>
</html>
